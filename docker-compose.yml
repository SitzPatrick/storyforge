services:
  storyforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: storyforge:latest
    container_name: storyforge
    environment:
      STORYFORGE_CONFIG: /app/config/config.yaml
      KOKORO_API_URL: ${KOKORO_API_URL:-http://kokoro:8880/v1}
      KOKORO_VOICE: ${KOKORO_VOICE:-af_bella}
      KOKORO_SPEED: ${KOKORO_SPEED:-1.0}
      KOKORO_MODEL: ${KOKORO_MODEL:-kokoro}
      KOKORO_API_KEY: ${KOKORO_API_KEY:-not-needed}
      STORYFORGE_OUTPUT_DIR: ${STORYFORGE_OUTPUT_DIR:-/output}
      STORYFORGE_TEMP_DIR: ${STORYFORGE_TEMP_DIR:-/app/temp}
      STORYFORGE_LOG_DIR: ${STORYFORGE_LOG_DIR:-/app/logs}
      STORYFORGE_BOOKS_DIR: ${STORYFORGE_BOOKS_DIR:-/books}
      STORYFORGE_CHUNK_CHARS: ${STORYFORGE_CHUNK_CHARS:-8000}
      STORYFORGE_KOKORO_TIMEOUT: ${STORYFORGE_KOKORO_TIMEOUT:-120}
    volumes:
      - ./books:/books:ro
      - ./output:/output
      - ./config:/app/config
      - ./logs:/app/logs
      - ./temp:/app/temp
    working_dir: /app
    command: ["sleep", "infinity"]
    restart: unless-stopped
