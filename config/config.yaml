paths:
  books_dir: /books
  output_dir: /output
  temp_dir: /app/temp
  log_dir: /app/logs
kokoro:
  api_url: http://Kokoro-FastAPI:8880/v1
  api_key: not-needed
  model: kokoro
  voice: af_heart
  speed: 1.0
  timeout_seconds: 120
  retry_delays_seconds: [2, 5, 10]
conversion:
  chunk_chars: 8000
  chapter_filename_format: Chapter {chapter:03d}.wav
  m4b_bitrate: 128k
  parallel_workers: 1
  cleanup_temp_on_success: true
  preserve_failed_temp: true
  resume_on_startup: true
analysis:
  llm_provider: ollama
  ollama_url: http://ollama:11434
  ollama_model: llama3.2:1b
  analysis_chunk_size: 6000
  cache_enabled: true
  cache_directory: analysis
normalization:
  enabled: true
  output_dir_name: analysis_normalized
  deduplicate_dialogue: true
  minimum_confidence: 0.5
  rejection_labels:
    characters:
      - I
      - me
      - my
      - mine
      - myself
      - you
      - your
      - yours
      - yourself
      - yourselves
