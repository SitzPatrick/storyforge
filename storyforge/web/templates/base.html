<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StoryForge{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
<header class="topbar"><a class="brand" href="/">STORY<span>FORGE</span></a><nav class="nav" aria-label="Primary">
  <a href="/">Projects</a><a href="/settings">Settings</a><a href="/diagnostics">Diagnostics</a>
  <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
</nav></header>
<main class="shell">{% block content %}{% endblock %}</main>
<footer class="footer">StoryForge · character-aware audiobook studio</footer>
</body></html>
