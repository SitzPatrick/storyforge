paths:
  books_dir: ./books
  output_dir: ./output
  temp_dir: ./temp
  log_dir: ./logs
kokoro:
  api_url: http://127.0.0.1:8880/v1
  api_key: not-needed
  model: kokoro
  voice: af_heart
  speed: 1.0
  timeout_seconds: 120
  retry_delays_seconds: [2, 5, 10]
conversion:
  chunk_chars: 8000
  chapter_filename_format: Chapter {chapter:03d}.wav
  m4b_bitrate: 128k
  parallel_workers: 1
  cleanup_temp_on_success: true
  preserve_failed_temp: true
  resume_on_startup: true
analysis:
  llm_provider: ollama
  ollama_url: http://ollama:11434
  ollama_model: qwen2.5:7b-instruct
  analysis_chunk_size: 6000
  cache_enabled: true
  cache_directory: analysis
normalization:
  enabled: true
  output_dir_name: analysis_normalized
  deduplicate_dialogue: true
  minimum_confidence: 0.5
  rejection_labels:
    characters:
      - I
      - me
      - my
      - mine
      - myself
      - you
      - your
      - yours
      - yourself
      - yourselves
      - he
      - him
      - his
      - himself
      - she
      - her
      - hers
      - herself
      - we
      - us
      - our
      - ours
      - ourselves
      - they
      - them
      - their
      - theirs
      - themselves
      - it
      - its
      - itself
      - someone
      - somebody
      - anyone
      - anybody
      - everyone
      - everybody
      - person
      - man
      - woman
      - girl
      - boy
      - people
      - villagers
      - miners
      - knight
      - here
      - there
      - place
      - unknown
      - unknown location
      - not specified
      - none
      - n/a
      - narrator
      - the narrator
      - a woman
      - heavy man
      - the girl
      - the quig
      - the leader
      - the guy who was coldly thrown to his death
      - the throwers
    places:
      - here
      - there
      - place
      - unknown
      - unknown location
      - not specified
      - none
      - n/a
    organizations:
      - unknown
      - unknown location
      - not specified
      - none
      - n/a
  aliases:
    characters:
      Bobby Pendragon:
        - Bobby
        - Pendragon
      Mark Dimond:
        - Mark
      Courtney Chetwynde:
        - Courtney
      Uncle Press:
        - Press
    places: {}
    organizations: {}
voice_planner:
  schema_version: 1
  enabled: true
  registry_path: voices/registry.json
  registry_dir_name: voices
  series_dir_name: series
  books_dir_name: books
  voice_plan_filename: voice_plan.json
  report_filename: voice_assignment_report.json
  preserve_user_edits: true
  dry_run_default: true
  scoring:
    schema_version: 1
    continuity_bonus: 1200
    manual_override_bonus: 1500
    locked_binding_bonus: 800
    inherited_binding_bonus: 500
    narrator_suitability_bonus: 700
    archetype_match_bonus: 450
    age_match_bonus: 300
    gender_match_bonus: 300
    species_match_bonus: 350
    prominence_match_bonus: 250
    quality_weight: 1000
    base_priority_weight: 10
    language_match_bonus: 600
    capability_match_bonus: 250
    scene_separation_bonus: 200
    similarity_cluster_penalty: 400
    reuse_penalty: 300
    scarcity_penalty_scale: 1
    unknown_metadata_behavior: neutral
  budget:
    schema_version: 1
    narrator_reserve: 1
    narrator_sharing_policy: prefer_distinct
    tier_weights:
      narrator: 1
      primary or lead characters: 2
      major recurring characters: 2
      supporting recurring characters: 1
      minor speaking characters: 1
      one-scene or one-off speakers: 0
      unresolved speakers: 0
    minimum_distinct_voices_by_tier:
      narrator: 1
      primary or lead characters: 1
      major recurring characters: 1
      supporting recurring characters: 1
      minor speaking characters: 0
      one-scene or one-off speakers: 0
      unresolved speakers: 0
    maximum_reuse_by_tier:
      narrator: 0
      primary or lead characters: 0
      major recurring characters: 1
      supporting recurring characters: 2
      minor speaking characters: 4
      one-scene or one-off speakers: 6
      unresolved speakers: 2
    protected_tier_thresholds:
      narrator: 1
      primary or lead characters: 1
      major recurring characters: 1
      supporting recurring characters: 0
    scarcity_thresholds:
      low: 1.0
      moderate: 1.2
      high: 1.5
      critical: 2.0
    reuse_penalty_scale: 1
    locked_binding_capacity_behavior: reserve
    inherited_binding_reserve_behavior: reserve_when_available
    unknown_prominence_behavior: conservative
    one_off_sharing_policy: preferred_due_to_scarcity
    dialogue_weight: 1
    scene_weight: 1
    recurrence_bonus: 1
    relationship_density_bonus: 1
    first_appearance_bonus: 1
    first_appearance_threshold: 3
    locked_binding_bonus: 1
    manual_override_bonus: 1
    inherited_binding_bonus: 1
    narrator_locked_bonus: 1
  conflicts:
    schema_version: 1
    adjacency_window: 1
    alternating_dialogue_threshold: 3
    shared_scene_thresholds:
      low: 1
      moderate: 2
      high: 3
      critical: 4
    shared_speaking_scene_thresholds:
      low: 1
      moderate: 2
      high: 3
      critical: 4
    relationship_density_thresholds:
      low: 0.25
      moderate: 0.5
      high: 0.75
      critical: 1.0
    severity_thresholds:
      low: 3
      moderate: 7
      high: 12
      critical: 18
    hard_separation_tier_pairs:
      - [primary or lead characters, major recurring characters]
      - [primary or lead characters, narrator]
      - [major recurring characters, narrator]
    similarity_cluster_policy: hard_for_high_conflict
    narrator_separation_policy: prohibit
    locked_conflict_policy: invalid
    scarcity_relaxation_policy: preserve_primary_major
    pairwise_penalty_weights:
      shared_scene: 2
      shared_speaking_scene: 4
      adjacent_dialogue: 3
      near_dialogue: 2
      alternating_dialogue: 5
      relationship_density: 4
      same_voice: 12
      same_similarity_cluster: 6
      role_similarity: 4
      narrator: 8
      locked: 10
    same_voice_prohibition_thresholds:
      shared_speaking_scene_count: 2
      shared_scene_count: 3
      alternating_dialogue_transitions: 3
    unresolved_conflict_behavior: report
