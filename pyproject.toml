[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storyforge"
version = "0.1.0a1"
description = "Deterministic audiobook production pipeline for EPUB-to-M4B workflows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Patrick Sitz" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "ebooklib>=0.18",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
dev = [
  "black>=24.4",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
storyforge = "storyforge.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*", "storyforge*"]

[tool.setuptools.package-data]
storyforge = ["defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require optional external services or binaries",
]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]
