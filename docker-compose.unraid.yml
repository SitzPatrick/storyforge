services:
  storyforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: storyforge:latest
    container_name: storyforge
    command: ["storyforge", "web", "--host", "0.0.0.0", "--port", "8787"]
    ports:
      - "${STORYFORGE_HOST_PORT:-8790}:8787"
    environment:
      TZ: ${TZ:-America/New_York}
      STORYFORGE_CONFIG: ${STORYFORGE_CONFIG:-/config/config.yaml}
      STORYFORGE_HOST: ${STORYFORGE_HOST:-0.0.0.0}
      STORYFORGE_PORT: ${STORYFORGE_PORT:-8787}
      STORYFORGE_CONFIG_DIR: ${STORYFORGE_CONFIG_DIR:-/config}
      STORYFORGE_DATA_DIR: ${STORYFORGE_DATA_DIR:-/data}
      STORYFORGE_BOOKS_DIR: ${STORYFORGE_BOOKS_DIR:-/data/books}
      STORYFORGE_PROJECTS_DIR: ${STORYFORGE_PROJECTS_DIR:-/data/projects}
      STORYFORGE_CACHE_DIR: ${STORYFORGE_CACHE_DIR:-/data/cache}
      STORYFORGE_OUTPUT_DIR: ${STORYFORGE_OUTPUT_DIR:-/data/output}
      STORYFORGE_LOG_DIR: ${STORYFORGE_LOG_DIR:-/data/logs}
      KOKORO_URL: ${KOKORO_URL:-http://Kokoro-FastAPI:8880}

    volumes:
      - ${STORYFORGE_CONFIG_PATH:-/mnt/user/appdata/storyforge/config}:/config
      - ${STORYFORGE_BOOKS_PATH:-/mnt/user/storyforge/books}:/data/books
      - ${STORYFORGE_PROJECTS_PATH:-/mnt/user/storyforge/projects}:/data/projects
      - ${STORYFORGE_CACHE_PATH:-/mnt/user/storyforge/cache}:/data/cache
      - ${STORYFORGE_OUTPUT_PATH:-/mnt/user/storyforge/output}:/data/output
      - ${STORYFORGE_LOG_PATH:-/mnt/user/appdata/storyforge/logs}:/data/logs
    restart: unless-stopped
    networks:
      - storyforge

networks:
  storyforge:
    external: true
    name: ${STORYFORGE_NETWORK:-storyforge-net}
